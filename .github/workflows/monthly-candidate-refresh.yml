name: Best Wines monthly winery candidate refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-candidate-refresh.yml'
      - 'scripts/audit-dataset.mjs'
      - 'scripts/compare-public.mjs'
      - 'scripts/build-publication-proposal.mjs'
      - 'src/sources/wikidata.ts'
  schedule:
    - cron: '30 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: bestwines-monthly-candidate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: wikidata
      LIMIT: '500'
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: '249562468297'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned TypeScript declarations without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts @types/node@26.6.5 @types/ngeohash@0.6.8
      - run: npm run build
      - name: Configure read-only AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::249562468297:role/BestWinesGitHubReadRole
          aws-region: eu-west-1
      - name: Verify read-only AWS identity
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Read internal winery identity/status metadata only
        run: |
          aws dynamodb scan \
            --table-name bw-dev-main \
            --projection-expression 'PK,SK,#t,#s,indexable,canonicalSlug,slug' \
            --expression-attribute-names '{"#t":"type","#s":"status"}' \
            --output json > /tmp/bw-main-internal.json
      - name: Generate candidate only - never publish
        run: npm run etl
      - name: Audit generated candidate
        run: node scripts/audit-dataset.mjs out/dataset.json
      - name: Compare fresh candidate with current public directory
        env:
          BW_PUBLIC_API: https://8y5sqsud79.execute-api.eu-west-1.amazonaws.com
          BW_INTERNAL_SCAN: /tmp/bw-main-internal.json
        run: node scripts/compare-public.mjs out/dataset.json
      - name: Build approval-gated publication proposal
        run: node scripts/build-publication-proposal.mjs out/public-comparison.json out/publication-proposal.json

      - name: Record non-publication boundary
        run: |
          echo '## Best Wines monthly candidate refresh' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow generates and audits a candidate dataset only.' >> "$GITHUB_STEP_SUMMARY"
          echo '**It does not publish to S3 or write to DynamoDB.**' >> "$GITHUB_STEP_SUMMARY"
          cat out/audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./out/public-comparison.json"); console.log("Candidate total: "+r.candidateTotal+"\nPublic total: "+r.publicTotal+"\nAlready public: "+r.alreadyPublic+"\nAlready known internally (not public): "+r.alreadyKnownInternal+"\nCandidate not public/new: "+r.candidateNotPublic+"\nPublic missing from fresh source: "+r.publicMissingFromFreshSource)' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const p=require("./out/publication-proposal.json"); console.log("\nProposal ready for review: "+p.proposedCount+"\nHeld for quality: "+p.heldForQualityCount+"\nApproval required: "+p.approvalRequired+"\nProduction write performed: "+p.productionWritePerformed)' >> "$GITHUB_STEP_SUMMARY"
      - name: Open monthly winery review case
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('out/publication-proposal.json','utf8'));
          const runUrl = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
          const title = 'Monthly winery publication review — ' + new Date().toISOString().slice(0,7);
          const body = [
            'Automated candidate review. No production write was performed.',
            '',
            '- Proposed for review: **'+p.proposedCount+'**',
            '- Remaining ready: **'+p.remainingReadyCount+'**',
            '- Held for quality: **'+p.heldForQualityCount+'**',
            '- Approval required: **'+p.approvalRequired+'**',
            '',
            'Workflow run and downloadable proposal artifact: '+runUrl,
            '',
            'Do not publish candidates from this issue alone; approve winery IDs explicitly in the publication step.'
          ].join('\n');
          fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/issues', {
            method:'POST',
            headers:{
              authorization:'Bearer '+process.env.GH_TOKEN,
              accept:'application/vnd.github+json',
              'x-github-api-version':'2022-11-28',
              'content-type':'application/json'
            },
            body: JSON.stringify({title,body})
          }).then(async r => {
            if(!r.ok) throw new Error('GitHub issue creation failed: '+r.status+' '+await r.text());
            console.log((await r.json()).html_url);
          }).catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Retain candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bestwines-wikidata-candidate-${{ github.run_id }}
          path: |
            out/dataset.json
            out/dataset.csv
            out/audit.json
            out/public-comparison.json
            out/publication-proposal.json
            out/publication-proposal.csv
          retention-days: 14
          if-no-files-found: error
